# nginx settings for serving the built website.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Any address falls back to index.html, where the React app takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built files have a unique name per version, so browsers may keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
