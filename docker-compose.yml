services:
  postgres:
    image: postgres:15
    container_name: nl-db-agent-demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nl_db_agent
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nl_db_agent"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
